services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stock
      POSTGRES_PASSWORD: stock
      POSTGRES_DB: stock
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock -d stock"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  api1:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://stock:stock@db:5432/stock?sslmode=disable
      PORT: "8080"
      INSTANCE_ID: api1
    depends_on:
      db:
        condition: service_healthy
    restart: always

  api2:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://stock:stock@db:5432/stock?sslmode=disable
      PORT: "8080"
      INSTANCE_ID: api2
    depends_on:
      db:
        condition: service_healthy
    restart: always

  api3:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://stock:stock@db:5432/stock?sslmode=disable
      PORT: "8080"
      INSTANCE_ID: api3
    depends_on:
      db:
        condition: service_healthy
    restart: always

  lb:
    image: nginx:1.27-alpine
    depends_on:
      - api1
      - api2
      - api3
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${HOST_PORT:-8080}:8080"
    restart: always

volumes:
  postgres_data:

